                widget: "string"

              - label: "Points Of Event"
                name: "points"
                widget: "list"
                fields:
                  - label: "Header (i.e. Event Overview: )"
                    name: "header"
                    default: "Event Overview: "
                    widget: "string"
                  - label: "Description of Event"
                    name: "text"
                    widget: "string"

              - label: "Upload Image"
                name: "upload"
                widget: "image"
