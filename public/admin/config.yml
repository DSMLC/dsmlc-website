backend:
  name: git-gateway
  branch: master

publish_mode: editorial_workflow

media_folder: "public/images" # Where uploaded images would go inside your repo
public_folder: "/images"      # Public URL for the images

collections:
  # -----------------------------------------------------------
  # 1) Manage "applications.json"
  # -----------------------------------------------------------
  - name: "applications"
    label: "Applications"
    files:
      - label: "Applications JSON"
        name: "applications"
        file: "public/data/applications.json"
        fields:
          - label: "Visionary Lab Manager"
            name: "visionary_lab_manager"
            widget: "list"
            max: 1
            fields:
              - label: "Application Form Link (# is there's no link)"
                name: "link"
                widget: "string"
                default: "#"
                required: true
              - label: "Button Name"
                name: "name"
                widget: "select"
                options:
                  - "No Positions Available for Manager"
                  - "Apply Now!"
                default: "No Positions Available for Manager"
                required: true

          - label: "Visionary Lab Member"
            name: "visionary_lab_member"
            widget: "list"
            max: 1
            fields:
              - label: "Application Form Link (# is there's no link)"
                name: "link"
                widget: "string"
                default: "#"
                required: true
              - label: "Button Name"
                name: "name"
                widget: "select"
                options:
                  - "No Positions Available for Members"
                  - "Apply Now!"
                default: "No Positions Available for Members"
                required: true

          - label: "Exec Positions"
            name: "exec_positions"
            widget: "list"
            max: 1
            fields:
              - label: "Header Text"
                name: "header"
                widget: "select"
                options:
                  - "No Positions Available Right Now."
                  - "Current Positions Available:"
                default: "Current Positions Available:"
                required: true
              - label: "List of Exec Positions Available"
                name: "text"
                widget: "list"
                field:
                  label: "Exec Position Name"
                  name: "item"
                  widget: "string"

          - label: "Apply Exec Button"
            name: "apply_exec_button"
            widget: "list"
            fields:
              - label: "Application Form Link (# is there's no link)"
                name: "link"
                widget: "string"
                default: "#"
                required: true
              - label: "Button Name"
                name: "name"
                widget: "select"
                options:
                  - "No Positions Available"
                  - "Apply Now!"
                default: "No Positions Available"
                required: true

  
  - name: "club_stats"
    label: "Club Information"
    files:
  # -----------------------------------------------------------
  # 2) Manage "club_stats.json"
  # -----------------------------------------------------------
      - label: "Club Stats JSON"
        name: "club_stats"
        file: "public/data/club_stats.json"
        fields:
          - label: "Club Members"
            name: "club_members"
            widget: "object"
            fields:
              - label: "Number of Members"
                name: "value"
                widget: "number"
              - label: "Club Members Field (Read Only. Do not Change)"
                name: "title"
                widget: "string"
                default: "Club Members"
                required: true
                read_only: true

          - label: "Events Held"
            name: "events_held"
            widget: "object"
            fields:
              - label: "Number of Events Held"
                name: "value"
                widget: "number"
              - label: "Events Held Field (Read Only. Do not Change)"
                name: "title"
                widget: "string"
                default: "Events Held"
                required: true
                read_only: true

          - label: "Event Attendees"
            name: "event_attendees"
            widget: "object"
            fields:
              - label: "Number of Event Attendees"
                name: "value"
                widget: "number"
              - label: "Event Attendees Field (Read Only. Do not Change)"
                name: "title"
                widget: "string"
                default: "Event Attendees"
                required: true
                read_only: true

  # -----------------------------------------------------------
  # 5) Manage "sponsors_info.json"
  # -----------------------------------------------------------
      - label: "Sponsors Info JSON"
        name: "sponsors_info"
        file: "public/data/sponsors_info.json"
        fields:
          - label: "Upload Image"
            name: "upload"
            widget: "image"
            media_folder: "/public/images/sponsors"
            public_folder: "/images/sponsors"
            required: false

          - label: "Sponsors Image Path List"
            name: "sponsors"
            widget: "list"
            fields:
              - label: "Image"
                name: "image"
                widget: "object"
                fields:
                  - label: "Image Path Link"
                    name: "imageLink"
                    widget: "string"

                  - label: "Image Name"
                    name: "imageName"
                    widget: "string"

                  - label: "Image Type (Read Only. Do not Change)"
                    name: "imageType"
                    widget: "string"
                    default: "Sponsor"
                    required: true
                    read_only: true
          - label: "Collabs Image Path List"
            name: "collabs"
            widget: "list"
            fields:
              - name: "image"
                label: "Image"
                widget: "object"
                fields:
                  - label: "Image Path Link"
                    name: "imageLink"
                    widget: "string"

                  - label: "Image Name"
                    name: "imageName"
                    widget: "string"

                  - label: "Image Type (Read Only. Do not Change)"
                    name: "imageType"
                    widget: "string"
                    default: "Sponsor"
                    required: true
                    read_only: true

  # -----------------------------------------------------------
  # 6) Manage "execs.json"
  # -----------------------------------------------------------
      - label: "Execs Info JSON"
        name: "execs"
        file: "public/data/execs.json"
        fields:
          - label: "Upload Image"
            name: "upload"
            widget: "image"
            media_folder: "/public/images/profile"
            public_folder: "/images/profile"
            required: false

          - label: "Executives"
            name: "execs"
            widget: "list"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"

              - label: "Category and Role"
                name: "role"
                widget: "list"
                fields:
                  - label: "Group Category (First 3 are exec roles, second 3 are VL roles)"
                    name: "group"
                    widget: "select"
                    options:
                      - "Admin Team"
                      - "Operations Team"
                      - "Legacy Executives (Advisory Team)"
                      - "Project Managers"
                      - "Advisors"
                      - "Visionary Lab Board"
                    default: "Admin Team"

                  - label: "Roles List In Category"
                    name: "roles"
                    widget: "list"
                    field:
                      label: "Role"
                      name: "role"
                      widget: "string"
                      required: false

              - label: "Profile Image Path Link"
                name: "profile"
                widget: "string"
                required: false

              - label: "University Program"
                name: "program"
                widget: "object"
                required: false
                fields:
                  - label: "List of Program(s)"
                    name: "programs"
                    widget: "list"
                    required: false
                    field:
                      label: "Program Name"
                      name: "program"
                      widget: "string"
                      required: false
                  - label: "University Year"
                    name: "year"
                    widget: "string"
                    required: false

              - label: "Bio (Not currently shown.)"
                name: "bio"
                widget: "text"
                required: false

  # -----------------------------------------------------------
  # 3) Manage "club_links.json"
  # -----------------------------------------------------------
      - label: "Club Links JSON"
        name: "club_links"
        file: "public/data/club_links.json"
        fields:
          # 1) Email Section
          - label: "Email Section"
            name: "email_section"
            widget: "object"
            fields:
              - label: "Section Name (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "Email"
                read_only: true
                required: true
              - label: "Email Link"
                name: "link"
                widget: "string"
                default: "mailto:datascienceclub@ucalgary.ca"
                required: true
              - label: "Email Label (Read Only. Do not Change)"
                name: "header"
                widget: "string"
                default: "Email: "
                read_only: true
                required: true
              - label: "Email Text"
                name: "text"
                widget: "string"
                default: "datascienceclub@ucalgary.ca"
                required: true
              - label: "Description"
                name: "description"
                widget: "text"
                default: "Have questions? Email us at "

          # 2) Membership
          - label: "Membership Section"
            name: "membership"
            widget: "object"
            fields:
              - label: "Button Text"
                name: "name"
                widget: "string"
                default: "Become a Member Now!"
                required: true
              - label: "Form Link"
                name: "link"
                widget: "string"
                default: "https://docs.google.com/forms/d/e/1FAIpQLScOGIqKjOxzu458lKIFtV3Kr3-Tf1jUvB4PyRZIXMxbvjEjHA/viewform"
                required: true

          # 3) Workshops
          - label: "Workshops Section"
            name: "workshops"
            widget: "object"
            fields:
              - label: "Button Text (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "Past Workshops"
                required: true
                read_only: true
              - label: "Workshops Link"
                name: "link"
                widget: "string"
                default: "https://drive.google.com/drive/folders/16I8AbsThFneWuxmp7N1n7UYInOtn9baK"
                required: true

          # 4) SU ClubHub
          - label: "ClubHub Section"
            name: "clubhub"
            widget: "object"
            fields:
              - label: "Button Text (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "SU ClubHub"
                read_only: true
                required: true
              - label: "ClubHub Link"
                name: "link"
                widget: "string"
                default: "https://suuofc.campuslabs.ca/engage/organization/dsmlc"
                required: true

          # 5) Discord
          - label: "Discord"
            name: "discord"
            widget: "object"
            fields:
              - label: "Platform Name (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "Discord"
                read_only: true
                required: true

              - label: "Invitation Link"
                name: "link"
                widget: "string"
                required: true

              - label: "Dark Logo Path"
                name: "dark_logo"
                widget: "string"
                required: true

              - label: "Light Logo Path"
                name: "light_logo"
                widget: "string"
                required: true

          # 6) Instagram
          - label: "Instagram"
            name: "insta"
            widget: "object"
            fields:
              - label: "Platform Name (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "Instagram"
                read_only: true
                required: true

              - label: "Profile Link"
                name: "link"
                widget: "string"
                default: "https://www.instagram.com/dsmlc.uofc/?hl=en"
                required: true

              - label: "Section Label (Read Only. Do not Change)"
                name: "header"
                widget: "string"
                default: "Instagram: "
                read_only: true
                required: true

              - label: "Handle"
                name: "text"
                widget: "string"
                required: true

              - label: "Dark Logo Path"
                name: "dark_logo"
                widget: "string"
                required: true

              - label: "Light Logo Path"
                name: "light_logo"
                widget: "string"
                required: true

          # 7) LinkedIn
          - label: "LinkedIn"
            name: "linkedin"
            widget: "object"
            fields:
              - label: "Platform Name (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "LinkedIn"
                read_only: true
                required: true

              - label: "Profile Link"
                name: "link"
                widget: "string"
                required: true

              - label: "Section Label (Read Only. Do not Change)"
                name: "header"
                widget: "string"
                default: "LinkedIn: "
                read_only: true
                required: true

              - label: "Profile Title"
                name: "text"
                widget: "string"
                required: true

              - label: "Dark Logo Path"
                name: "dark_logo"
                widget: "string"
                required: true

              - label: "Light Logo Path"
                name: "light_logo"
                widget: "string"
                required: true

          # 8) Linktree
          - label: "Linktree"
            name: "linktree"
            widget: "object"
            fields:
              - label: "Platform Name (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "Linktree"
                read_only: true
                required: true

              - label: "Linktree Link"
                name: "link"
                widget: "string"
                required: true

              - label: "Dark Logo Path"
                name: "dark_logo"
                widget: "string"
                required: true

              - label: "Light Logo Path"
                name: "light_logo"
                widget: "string"
                required: true

          # 9) Phone
          - label: "Phone Section"
            name: "phone"
            widget: "object"
            fields:
              - label: "Phone Label (Read Only. Do not Change)"
                name: "header"
                widget: "string"
                default: "Phone: "
                read_only: true
                required: true
              - label: "Phone Number"
                name: "text"
                widget: "string"
                required: true

          # 10) Regular Package
          - label: "Regular Competition Package"
            name: "regular_package"
            widget: "object"
            fields:
              - label: "Package Link"
                name: "link"
                widget: "string"
                default: "https://drive.google.com/file/d/1EEX-c5iE_3ZXbn79-o1CyWvqBYZMHrB4/view?usp=sharing"
                required: true
              - label: "Package Name (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "Regular Package"
                read_only: true
                required: true

          # 11) Final Competition Package
          - label: "Final Competition Package"
            name: "final_comp_package"
            widget: "object"
            fields:
              - label: "Package Link"
                name: "link"
                widget: "string"
                default: "https://drive.google.com/file/d/1eZgpEZoi7_OGqxZatHgXK8dkSYkezfds/view?usp=sharing"
                required: true
              - label: "Package Name (Read Only. Do not Change)"
                name: "name"
                widget: "string"
                default: "Final Competition Package"
                read_only: true
                required: true

  # -----------------------------------------------------------
  # 4) Manage "upcoming_events.json"
  # -----------------------------------------------------------
  - name: "upcoming_events"
    label: "Upcoming Events"
    files:
      - label: "Upcoming Events JSON"
        name: "upcoming_events"
        file: "public/data/upcoming_events.json"
        fields:
          - label: "Final Competition Event List"
            name: "final_comp"
            widget: "list"
            fields:
              - label: "DATE of event (i.e. February 10th, 2024)"
                name: "title"
                widget: "string"
              - label: "Event Details (Fill Header and Description of event below)"
                name: "subSection"
                widget: "list"
                fields:
                  - label: "Title of Event"
                    name: "header"
                    widget: "string"
                  - label: "Description of Event"
                    name: "text"
                    widget: "text"

          - label: "Final Competition Event Registration Button"
            name: "final_comp_register"
            widget: "list"
            fields:
              - label: "Event Link (Default to # if there's no event)"
                name: "link"
                default: "#"
                required: true
                widget: "string"
              - label: "Button Name"
                name: "name"
                widget: "select"
                options:
                  - "Registrations Closed At the Moment"
                  - "Register for Event"
                default: "Registrations Closed At the Moment"
                required: true

          - label: "Workshops Event List"
            name: "workshops"
            widget: "list"
            fields:
              - label: "DATE of event (i.e. February 10th, 2024)"
                name: "title"
                widget: "string"
              - label: "Event Details (Fill Header and Description of event below)"
                name: "subSection"
                widget: "list"
                fields:
                  - label: "Title of Event"
                    name: "header"
                    widget: "string"
                  - label: "Description of Event"
                    name: "text"
                    widget: "text"

          - label: "Workshops Register"
            name: "workshops_register"
            widget: "list"
            fields:
              - label: "Event Link (Default to # if there's no event)"
                name: "link"
                default: "#"
                required: true
                widget: "string"
              - label: "Button Name"
                name: "name"
                widget: "select"
                options:
                  - "Registrations Closed At the Moment"
                  - "Register for Event"
                default: "Registrations Closed At the Moment"
                required: true

          - label: "Other Events List"
            name: "other_events"
            widget: "list"
            fields:
              - label: "DATE of event (i.e. February 10th, 2024)"
                name: "title"
                widget: "string"
              - label: "Event Details (Fill Header and Description of event below)"
                name: "subSection"
                widget: "list"
                fields:
                  - label: "Title of Event"
                    name: "header"
                    widget: "string"
                  - label: "Description of Event"
                    name: "text"
                    widget: "text"

          - label: "Other Events Register"
            name: "other_events_register"
            widget: "list"
            fields:
              - label: "Event Link (Default to # if there's no event)"
                name: "link"
                default: "#"
                required: true
                widget: "string"
              - label: "Button Name"
                name: "name"
                widget: "select"
                options:
                  - "Registrations Closed At the Moment"
                  - "Register for Event"
                default: "Registrations Closed At the Moment"
                required: true

